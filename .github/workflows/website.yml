name: website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # the public URL and base path (repository variables), for canonical links, the sitemap and asset URLs.
          # Defaults serve from https://paulomenin.github.io/shellmate; for a custom domain set SITE and BASE=/
          SITE: ${{ vars.SITE || 'https://paulomenin.github.io' }}
          BASE: ${{ vars.BASE || '/shellmate' }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Gihub Pages
        id: deployment
        uses: actions/deploy-pages@v5

