sonar.projectKey=shellmate
sonar.projectName=shellmate
sonar.sourceEncoding=UTF-8

# Analyze the Rust workspace, shell templates, tooling, website code, and workflows.
sonar.sources=crates,tools,website/src,website/public,website/astro.config.mjs,.github/workflows
sonar.tests=crates,tools
sonar.test.inclusions=crates/**/tests/**,tools/shellmate-testing/**,tools/e2e/**,tools/bench/test_*.py,tools/bench/evals/test_*.py

# Benchmark results, recorded responses, fixtures, experiments, and docs content.
sonar.exclusions=tools/spikes/**,tools/bench/results/**,tools/bench/evals/cassettes/**,tools/bench/evals/fixtures/**,tools/bench/evals/published/**,website/src/content/docs/**

# CI already runs Clippy. The coverage artifact contains Rust coverage only.
sonar.rust.clippy.enabled=false
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=crates/shells/**,tools/**,website/**,.github/**
