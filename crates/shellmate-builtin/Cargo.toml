[package]
name = "shellmate-builtin"
description = "The first-party plugins (provider, decider, middleware, store, tools) and their registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["provider-openai-compatible", "decider-systemone", "middleware-redact", "store-tmpfs", "tool-man", "tool-exec"]
provider-openai-compatible = ["dep:reqwest", "dep:tokio", "dep:async-trait", "dep:serde", "dep:serde_json"]
decider-systemone = ["dep:reqwest", "dep:async-trait", "dep:serde", "dep:serde_json"]
middleware-redact = ["dep:regex", "dep:sha2", "dep:async-trait", "dep:serde", "dep:serde_json"]
store-tmpfs = ["dep:libc", "dep:serde", "dep:serde_json"]
tool-man = ["dep:async-trait", "dep:serde", "dep:serde_json"]
tool-exec = ["dep:async-trait", "dep:serde", "dep:serde_json"]

[dependencies]
shellmate-api.workspace = true
async-trait = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
regex = { version = "1", optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
shellmate-testing.workspace = true
tokio.workspace = true
