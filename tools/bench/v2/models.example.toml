version = 2

[run]
image = "shellmate-evals:v2"
cases = "cases"
fixtures = "fixtures"
models = ["local"]
deciders = ["local-checker"]
modes = ["generator", "decider", "combined"]
repeats = 3
warmup = true
max_requests = 1000
max_cost_usd = 1.0
max_output_tokens = 4096
timeout_secs = 120
# Wait out a rate limit or a server error (429, 5xx, no answer) and run the case again; 0 turns it off.
retries = 3
retry_wait_secs = 5          # first wait; doubles each time, or the provider's Retry-After
retry_max_wait_secs = 120
# reuse_container = true   # cases of one profile share a container, each on a clean slate; false = one per case
# report_every = 10         # rewrite the reports every N cases (and at the end)
# price_date = "YYYY-MM-DD" # required when publishing hosted cost comparisons

[providers.ollama]
endpoint = "http://127.0.0.1:11434"
trust = "local"

[models.local]
provider = "ollama"
model = "replace-with-an-installed-model"
settings = { reasoning_effort = "none", timeout_secs = 120 }
# Zero API cost excludes hardware and electricity.
pricing = { input_per_million = 0, output_per_million = 0 }

[deciders.local-checker]
provider = "ollama"
model = "replace-with-an-installed-model"
# Chat models use the real product's JSON decision prompt.
# For a native decision model: plugin = "systemone"
# settings = { path = "/v1/systemone", timeout_secs = 120 }
pricing = { input_per_million = 0, output_per_million = 0 }

# Hosted example: explicitly select this model in run.models to use it.
# No provider is contacted by --plan or --list.
# [providers.hosted]
# endpoint = "https://api.example.com"
# trust = "remote"
# api_key = "prompt:EVAL_KEY" # hidden prompt, only in the eval process's memory
# # Alternatively: api_key = "env:SHELLMATE_EVAL_API_KEY" or api_key = "file:eval.key" (chmod 600)
#
# [models.hosted]
# provider = "hosted"
# model = "model-id"
# # Fill in current dated prices from the provider. Do not copy guessed prices.
# pricing = { input_per_million = 0, output_per_million = 0 }
#
# [deciders.hosted]
# provider = "hosted"
# model = "decision-model-id"
# plugin = "systemone"
# settings = { path = "/alpha/decisions", timeout_secs = 120 }
# # Some decision APIs charge per request and return no usage.
# pricing = { per_request = 0 }
