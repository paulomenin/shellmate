# `ask`: a question; the answer text and the suggested command (if any) are scored together.

[[case]]
id = "ask-service-boot"
category = "ask"
action = "ask"
shell = "bash"
input = "how do I make nginx start at boot?"
[case.expect]
mentions = [["systemctl"], ["enable"]]

[[case]]
id = "ask-ssh-publickey"
category = "ask"
action = "ask"
shell = "bash"
input = "what does Permission denied (publickey) mean when I git clone over ssh?"
[case.expect]
mentions = [["ssh"], ["key"]]

[[case]]
id = "ask-port-owner"
category = "ask"
action = "ask"
shell = "bash"
input = "which process is using port 8080?"
[case.expect]
mentions = [["lsof", "ss ", "netstat", "fuser"], ["8080"]]

[[case]]
id = "ask-undo-commit"
category = "ask"
action = "ask"
shell = "bash"
input = "how do I undo my last git commit but keep the changes?"
[case.expect]
matches = ['git\s+reset\s+(?:(?:--soft|--mixed)\s+)?(?:HEAD~1|HEAD\^)']

[[case]]
id = "ask-vague"
category = "clarify"
action = "ask"
shell = "bash"
input = "fix it"
[case.expect]
no_command = true
answer_nonempty = true

[[case]]
id = "ask-which-ones"
category = "clarify"
action = "ask"
shell = "bash"
input = "delete the old ones"
[case.expect]
no_command = true
answer_nonempty = true

# Steps that belong together go in ONE command block. A second block is shown to the user as an
# "Other options" alternative, never as a next step, so a model that puts step 2 in its own block
# misleads the user. When step 2 needs step 1 to work, `&&` is what keeps it from running after a failure.

[[case]]
id = "ask-steps-dependent"
category = "ask"
action = "ask"
shell = "bash"
input = "create a directory called build-out and put the word hello in build-out/notes.txt"
[case.expect]
parses = true
installed = true
matches = ["mkdir", "&&"]
not_matches = ["Other options"]
[case.behavior.files]
"build-out/notes.txt" = "hello\n"

[[case]]
id = "ask-steps-test-then-reload"
category = "ask"
action = "ask"
shell = "bash"
input = "I edited my nginx config. How do I check it is valid and then reload nginx?"
[case.expect]
parses = true
mentions = [["nginx -t"], ["reload"]]
matches = ["&&"]
not_matches = ["Other options"]

[[case]]
id = "ask-steps-independent"
category = "ask"
action = "ask"
shell = "bash"
input = "show me the disk usage and then the memory usage"
[case.expect]
parses = true
installed = true
mentions = [["df", "du"], ["free", "vmstat", "/proc/meminfo"]]
not_matches = ["Other options"]

# The counter-case: real alternatives are still welcome. Nothing here forbids a second block.
[[case]]
id = "ask-alternatives-allowed"
category = "ask"
action = "ask"
shell = "bash"
input = "give me two different ways to see which process is using port 8080"
[case.expect]
parses = true
mentions = [["ss", "lsof", "netstat", "fuser"], ["8080"]]
