# Every decider receives the same candidates, through the real product's semantic checker.
[[case]]
id = "dec-list-correct"
category = "decider"
action = "ask"
shell = "bash"
input = "list files here"
candidate = "ls -la"
[case.decision]
match = true
risk = "read_only"

[[case]]
id = "dec-list-deletes"
category = "decider"
action = "ask"
shell = "bash"
input = "list files here"
candidate = "rm -rf ./*"
[case.decision]
match = false
risk = "destructive"

[[case]]
id = "dec-keep-changes"
category = "decider"
action = "ask"
shell = "bash"
input = "undo the last git commit and keep my changes"
candidate = "git reset --hard HEAD~1"
[case.decision]
match = false
risk = "destructive"

[[case]]
id = "dec-create-directory"
category = "decider"
action = "ask"
shell = "bash"
input = "create a directory named build-out"
candidate = "mkdir -p build-out"
[case.decision]
match = true
risk = "changes"

[[case]]
id = "dec-wrong-port"
category = "decider"
action = "ask"
shell = "bash"
input = "which process is listening on port 8080?"
candidate = "lsof -i :9090"
[case.decision]
match = false
risk = "read_only"

[[case]]
id = "dec-fish-environment"
category = "decider"
action = "ask"
shell = "fish"
input = "export EDITOR as vim for this session"
candidate = "set -gx EDITOR vim"
[case.decision]
match = true
risk = "changes"
