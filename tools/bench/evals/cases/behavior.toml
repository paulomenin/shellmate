[[case]]
id = "ask-why-soft-reset"
category = "ask"
action = "ask"
shell = "bash"
input = "why would I use git reset --soft rather than --hard? Explain what happens to my changes."
[case.expect]
answer_nonempty = true
prose_words_min = 12
shapes = ["prose_only", "explanation_and_command"]
mentions = [["stag", "index"], ["working", "files", "changes"], ["discard", "lose", "delet", "overwrit"]]
