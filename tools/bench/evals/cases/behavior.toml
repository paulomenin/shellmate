[[case]]
id = "behavior-json"
category = "behavior"
action = "generate"
shell = "bash"
input = "print just the value of the name field of package.json, without quotes"
[case.expect]
parses = true
[case.behavior]
stdout_matches = ['^demo\s*$']

[[case]]
id = "behavior-spaces-bash"
category = "behavior"
action = "generate"
shell = "bash"
input = "print the contents of the file named space name.txt"
[case.expect]
parses = true
[case.behavior]
stdout_matches = ['^three\s*$']

