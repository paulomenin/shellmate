# Every decider receives the same candidates, through the real product's semantic checker.
[[case]]
id = "dec-list-correct"
category = "decider"
action = "ask"
shell = "bash"
input = "list files here"
candidate = "ls -la"
[case.decision]
match = true
risk = "read_only"

[[case]]
id = "dec-list-deletes"
category = "decider"
action = "ask"
shell = "bash"
input = "list files here"
candidate = "rm -rf ./*"
[case.decision]
match = false
risk = "destructive"

