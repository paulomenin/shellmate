[package]
name = "streaming-spike"
version = "0.0.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = 3
