# cargo-deny: licenses, advisories, bans and sources (docs/security.md T9)
[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# the workspace crates depend on each other by path, without a version (publish = false)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
